name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Publish to npm
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 单一事实源：同 verify.yml 复用一份脚本（脚本内含"URL 已 200 但 npm i 仍 ETARGET"的秒级重试）
      - name: Verify pullable from npm
        run: bash scripts/verify-npm-release.sh "$GITHUB_REF_NAME"

