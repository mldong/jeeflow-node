name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Checkout jeeflow-java（测试依赖共享流程 JSON）
      - name: Checkout jeeflow-java
        uses: actions/checkout@v4
        with:
          repository: mldong/jeeflow-java
          path: jeeflow-java

      # Checkout jeeflow-node
      - name: Checkout jeeflow-node
        uses: actions/checkout@v4
        with:
          path: jeeflow-node

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jeeflow-node/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: jeeflow-node

      - name: Run tests
        run: npm test
        working-directory: jeeflow-node

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-artifacts
          path: dist/
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Publish to npm
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify:
    name: Verify npm
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Wait for npm CDN sync
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "⏳ 等待 npm CDN 同步..."
          sleep 30
          for i in {1..10}; do
            PUBLISHED=$(npm view @mldong/jeeflow version 2>/dev/null || echo "")
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "✅ npm @mldong/jeeflow@$VERSION 已可用"
              exit 0
            fi
            echo "   等待中... ($i/10) 当前: $PUBLISHED"
            sleep 15
          done
          echo "❌ npm 验证超时"
          exit 1
